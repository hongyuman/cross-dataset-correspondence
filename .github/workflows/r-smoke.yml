name: R example and core checks
on: [push, pull_request, workflow_dispatch]
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("Matrix", "glmnet"), repos="https://cloud.r-project.org")'
      - name: Check alignment and aggregation
        run: Rscript tests/test_core.R
      - name: Run synthetic A/B/C example
        run: Rscript example_ABC.R ci_example_output
